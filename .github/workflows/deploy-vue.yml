name: deploy vue
on:
  push:
    branches:
      - prod
jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: check out the code to build server
        uses: actions/checkout@v4
        
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
          
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: build the code
        run: |
          # 1. 开启扁平化，解决 pnpm 隐藏底层依赖的问题
          pnpm config set shamefully-hoist true
          pnpm install --no-frozen-lockfile
          # 2. 补齐缺失的包
          pnpm add -D cache-loader eslint-loader babel-loader
          # 3. 终极魔法：强行让 Node 20 兼容老版 Webpack 的加密算法
          export NODE_OPTIONS=--openssl-legacy-provider
          pnpm build
          
      - name: set the ubuntu user as the owner of the /var/www/html directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo chown -R ubuntu /var/www/html
            
      - name: copy file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1
          
      - name: set the root user back as the owner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo chown -R root /var/www/html